name: Pages

# Publishes blog.candace.cloud. The site's generator is a package of this
# module (blog-site/), its content is tracked beside it, and every snapshot the
# monorepo exporter pushes to main is tested, rendered, privacy-scanned, and
# deployed to GitHub Pages.
#
# This replaces the workflow that used to run in the standalone
# candacelabs/blog-site repository, where the generator was the repository root.
# The only structural difference is that the module root and the generator's
# package directory are no longer the same directory.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a cancelled deploy
# leaves the live site on whichever half-published state it reached.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The generator is a package of the module rooted at this repository, so
      # the module root is mounted and the work happens in blog-site/ inside it.
      # The projects grid is derived from the candacelabs public repository
      # listing at render time; the workflow token is enough to read it.
      - name: Test and render the site
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env GOCACHE=/tmp/gocache \
            --env GOMODCACHE=/tmp/gomod \
            --env GOPATH=/tmp/gopath \
            --env GOTOOLCHAIN=local \
            --env GOFLAGS=-mod=readonly \
            --env "GITHUB_TOKEN=${GH_API_TOKEN}" \
            --env "RELEASE_SHA=${GITHUB_SHA}" \
            --volume "${PWD}:/src" \
            --workdir /src/blog-site \
            golang:1.26.5-bookworm@sha256:6c5605ab3a9a9fb3c4eafe5b3d63cdbf3881caf113262b67862547b54a9db599 \
            sh -eu -c 'go test ./... && go run . render -out public'

      - name: Install privacy scanner
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      # Refuses to publish rendered output carrying contact details,
      # private-profile links, or private and tailnet network addresses. It
      # fails closed: an unreadable output directory or an rg error is a
      # failure, not a pass.
      - name: Check the public privacy boundary
        run: ./blog-site/scripts/check-public-content.sh blog-site/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: blog-site/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job in this repository that is granted more than `contents:
    # read`, and it is granted it for one step.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
